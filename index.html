<script>


/*
==================================================
중요
==================================================

아래 주소를 본인의 Apps Script
웹앱 URL로 변경하세요.

예:

const API_URL =
  'https://script.google.com/macros/s/ABC123/exec';

==================================================
*/


const API_URL =
  'https://script.google.com/macros/s/AKfycbxlwX7YcyfFtO1FcG7ao57yGpzlI84N04ybB341E1Tjm1cf300XaxrhLBFYk1axIampOA/exec';



/*
==================================================
전역 변수
==================================================
*/


let scanner = null;

let scannerRunning = false;

let currentBook = null;

let lastScannedISBN = '';

let lastScanTime = 0;



/*
==================================================
Apps Script API 호출
==================================================
*/


async function api(
  action,
  payload = {}
) {

  const response =
    await fetch(
      API_URL,
      {

        method: 'POST',

        headers: {
          'Content-Type':
            'text/plain;charset=utf-8'
        },

        body:
          JSON.stringify({

            action:
              action,

            ...payload

          })

      }
    );


  const result =
    await response.json();


  if (
    !result.success
  ) {

    throw new Error(
      result.error ||
      '서버 오류'
    );
  }


  return result.data;
}



/*
==================================================
화면 전환
==================================================
*/


function showScreen(
  id
) {

  document
    .querySelectorAll(
      '.screen'
    )
    .forEach(
      screen => {

        screen.classList
          .remove('active');

      }
    );


  document
    .getElementById(id)
    .classList
    .add('active');


  window.scrollTo(
    0,
    0
  );
}



/*
==================================================
홈으로
==================================================
*/


async function goHome() {

  await stopScanner();

  showScreen(
    'homeScreen'
  );

  loadRecent();
}



/*
==================================================
스캐너 열기
==================================================
*/


async function openScanner() {

  showScreen(
    'scannerScreen'
  );


  const status =
    document.getElementById(
      'scannerStatus'
    );


  status.className =
    'status';


  status.textContent =
    '📷 카메라를 준비하고 있습니다...';


  try {

    await startScanner();

  } catch (error) {

    status.className =
      'status error';


    status.textContent =
      '카메라를 시작할 수 없습니다. ' +
      error.message;

  }
}



/*
==================================================
카메라 시작
==================================================
*/


async function startScanner() {

  if (
    scannerRunning
  ) {

    return;
  }


  if (
    typeof Html5Qrcode ===
    'undefined'
  ) {

    throw new Error(
      '스캐너 라이브러리를 불러오지 못했습니다.'
    );
  }


  scanner =
    new Html5Qrcode(
      'reader'
    );


  const config = {

    fps: 10,


    qrbox:
      function(
        width,
        height
      ) {

        return {

          width:
            Math.floor(
              width * 0.82
            ),

          height:
            Math.floor(
              Math.min(
                120,
                height * 0.25
              )
            )

        };

      },


    formatsToSupport: [

      Html5QrcodeSupportedFormats
        .EAN_13

    ],


    rememberLastUsedCamera:
      true

  };


  let cameras = [];


  try {

    cameras =
      await Html5Qrcode
        .getCameras();

  } catch (error) {

    throw new Error(
      '카메라 권한을 허용했는지 확인해주세요.'
    );

  }


  if (
    !cameras ||
    cameras.length === 0
  ) {

    throw new Error(
      '사용 가능한 카메라를 찾지 못했습니다.'
    );
  }


  /*
   * 우선 후면 카메라를 찾습니다.
   */

  let camera =
    cameras[
      cameras.length - 1
    ];


  const backCamera =
    cameras.find(
      camera => {

        const label =
          (
            camera.label ||
            ''
          ).toLowerCase();


        return (

          label.includes('back') ||

          label.includes('rear') ||

          label.includes('environment') ||

          label.includes('후면')

        );

      }
    );


  if (
    backCamera
  ) {

    camera =
      backCamera;
  }


  await scanner.start(

    camera.id,

    config,

    onScanSuccess,

    function() {

      /*
       * 바코드를 찾지 못한
       * 일반적인 경우입니다.
       *
       * 화면에는 표시하지 않습니다.
       */

    }

  );


  scannerRunning =
    true;


  document
    .getElementById(
      'scannerStatus'
    )
    .className =
      'status success';


  document
    .getElementById(
      'scannerStatus'
    )
    .textContent =
      '📷 카메라가 켜졌습니다. ISBN 바코드를 비춰주세요.';


  document
    .getElementById(
      'scanCount'
    )
    .textContent =
      'ISBN-13 바코드를 기다리는 중...';

}



/*
==================================================
ISBN 스캔 성공
==================================================
*/


async function onScanSuccess(
  decodedText
) {

  let isbn =
    String(decodedText)
      .replace(
        /[^0-9Xx]/g,
        ''
      )
      .toUpperCase();


  /*
   * ISBN-13만 사용
   */

  if (
    isbn.length !== 13
  ) {

    return;
  }


  /*
   * 동일 바코드가
   * 계속 인식되는 것을 방지
   */

  const now =
    Date.now();


  if (

    isbn ===
    lastScannedISBN &&

    now -
    lastScanTime <
    4000

  ) {

    return;
  }


  lastScannedISBN =
    isbn;


  lastScanTime =
    now;


  document
    .getElementById(
      'scanCount'
    )
    .textContent =
      'ISBN ' +
      isbn +
      ' 인식됨';


  await stopScanner();


  await lookupBook(
    isbn
  );
}



/*
==================================================
스캐너 정지
==================================================
*/


async function stopScanner() {

  if (
    !scanner
  ) {

    return;
  }


  if (
    !scannerRunning
  ) {

    return;
  }


  try {

    await scanner.stop();

  } catch (error) {

    console.warn(error);

  }


  try {

    scanner.clear();

  } catch (error) {

    console.warn(error);

  }


  scanner =
    null;


  scannerRunning =
    false;
}



/*
==================================================
스캐너 닫기
==================================================
*/


async function closeScanner() {

  await stopScanner();

  goHome();
}



/*
==================================================
ISBN으로 도서정보 조회
==================================================
*/


async function lookupBook(
  isbn
) {

  showScreen(
    'bookScreen'
  );


  const status =
    document.getElementById(
      'bookStatus'
    );


  status.className =
    'status';


  status.textContent =
    '📚 도서정보를 조회하고 있습니다...';


  try {

    const book =
      await api(
        'lookup',
        {
          isbn:
            isbn
        }
      );


    if (
      !book.found
    ) {

      status.className =
        'status warning';


      status.textContent =
        '도서정보를 찾지 못했습니다. ' +
        'ISBN을 확인하거나 직접 입력해주세요.';


      currentBook = {

        isbn:
          book.isbn,

        title:
          '',

        authors:
          '',

        publisher:
          '',

        publishedDate:
          '',

        pageCount:
          '',

        thumbnail:
          '',

        source:
          ''

      };


      renderBook(
        currentBook
      );


      return;
    }


    currentBook =
      book;


    renderBook(
      book
    );


    const duplicates =
      await api(
        'duplicate',
        {
          isbn:
            book.isbn
        }
      );


    renderDuplicates(
      duplicates
    );


    if (
      duplicates.length
    ) {

      status.className =
        'status warning';


      status.textContent =
        '⚠ 같은 ISBN의 소장본이 ' +
        duplicates.length +
        '권 있습니다. 추가 소장본이면 그대로 등록하세요.';

    } else {

      status.className =
        'status success';


      status.textContent =
        '✅ 도서정보를 찾았습니다. 소장 정보를 입력하세요.';

    }


  } catch (error) {

    status.className =
      'status error';


    status.textContent =
      '조회 오류: ' +
      error.message;

  }
}



/*
==================================================
도서정보 표시
==================================================
*/


function renderBook(
  book
) {

  const info =
    document.getElementById(
      'bookInfo'
    );


  let cover;


  if (
    book.thumbnail
  ) {

    cover = `

      <img
        class="cover"
        src="${escapeHtml(
          book.thumbnail
        )}"
        alt="표지">

    `;

  } else {

    cover = `

      <div
        class="cover"
        style="
          display:flex;
          align-items:center;
          justify-content:center;
          color:#999;
          font-size:12px;
        ">

        표지 없음

      </div>

    `;

  }


  info.innerHTML = `

    <div class="book-head">

      ${cover}


      <div>

        <div
          class="book-title">

          ${escapeHtml(
            book.title ||
            '제목 없음'
          )}

        </div>


        <div
          class="book-meta">

          ${escapeHtml(
            book.authors ||
            '저자 정보 없음'
          )}

        </div>


        <div
          class="book-meta">

          ${escapeHtml(
            book.publisher ||
            ''
          )}

          ${
            book.publishedDate
              ? ' · ' +
                escapeHtml(
                  book.publishedDate
                )
              : ''
          }

          ${
            book.pageCount
              ? ' · ' +
                escapeHtml(
                  String(
                    book.pageCount
                  )
                ) +
                '쪽'
              : ''
          }

        </div>

      </div>

    </div>


    <div class="isbn">

      ISBN:
      ${escapeHtml(
        book.isbn ||
        ''
      )}

/*
==================================================

==================================================
*/


function renderDuplicates(
  items
) {

  const element =
    document.getElementById(
      'duplicateInfo'
    );


  if (
    !items ||
    items.length === 0
  ) {

    element.innerHTML =
      '';

    return;
  }


  let html = `

    <div class="duplicate">

      <div class="duplicate-title">

        ⚠ 이미 소장 중인 책

      </div>

      <div
        style="margin-top:8px;">

  `;


  items.forEach(
    item => {

      html += `

        <div
          style="
            margin-top:7px;
            padding-top:7px;
            border-top:1px solid #f0dfb0;
          ">

          <strong>

            ${escapeHtml(
              item.id
            )}

          </strong>


          ${
            item.location
              ? ' · 위치: ' +
                escapeHtml(
                  item.location
                )
              : ''
          }


          ${
            item.condition
              ? ' · 상태: ' +
                escapeHtml(
                  item.condition
                )
              : ''
          }


          ${
            item.supplement
              ? ' · 부록: ' +
                escapeHtml(
                  item.supplement
                )
              : ''
          }

        </div>

      `;

    }
  );


  html += `

      </div>

    </div>

  `;


  element.innerHTML =
    html;
}

async function saveBook() {

  if (
    !currentBook
  ) {

    throw new Error(
      '등록할 도서가 없습니다.'
    );
  }


  const button =
    document.getElementById(
      'saveNextButton'
    );


  button.disabled =
    true;


  button.textContent =
    '저장하는 중...';


  try {

    return await api(
      'save',
      {
        book:
          collectBook()
      }
    );


  } finally {

    button.disabled =
      false;


    button.textContent =
      '💾 저장하고 다음 책 스캔';

  }
}

async function loadRecent() {

  try {

    const items =
      await api(
        'recent'
      );


    const list =
      document.getElementById(
        'recentList'
      );


    if (
      !items ||
      items.length === 0
    ) {

      list.innerHTML = `

        <div class="empty">

          아직 등록된 책이 없습니다.

        </div>

      `;

      return;
    }


    list.innerHTML =
      items
        .map(
          item => `

            <div
              class="recent-item">

              <div
                class="recent-title">

                ${escapeHtml(
                  item.title ||
                  '제목 없음'
                )}

              </div>


              <div
                class="small">

                ${escapeHtml(
                  item.author ||
                  ''
                )}

              </div>


              <div
                class="small">

                ${escapeHtml(
                  item.id
                )}

                ${
                  item.location
                    ? ' · ' +
                      escapeHtml(
                        item.location
                      )
                    : ''
                }

                ${
                  item.supplement
                    ? ' · 부록 ' +
                      escapeHtml(
                        item.supplement
                      )
                    : ''
                }

              </div>

            </div>

          `
        )
        .join('');


  } catch (error) {

    document
      .getElementById(
        'recentList'
      )
      .innerHTML = `

        <div class="empty">

          최근 목록을
          불러오지 못했습니다.

        </div>

      `;

  }
}



/*
==================================================
HTML 특수문자 처리
==================================================
*/


function escapeHtml(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return '';

  }


  return String(value)

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}
