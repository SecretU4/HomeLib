<!DOCTYPE html>
<html>
<head>

  <base target="_top">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no">

  <title>내 서재 스캐너</title>


  <!--
    ISBN / EAN 바코드 스캐너
  -->
  <script
  src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
  type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 16px;

      background: #f5f6f7;

      color: #222;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans KR",
        sans-serif;
    }


    h1 {

      font-size: 22px;

      margin:
        4px 0 16px;
    }


    h2 {

      font-size: 17px;

      margin:
        22px 0 10px;
    }


    .card {

      background: white;

      border-radius: 14px;

      padding: 16px;

      margin-bottom: 14px;

      box-shadow:
        0 2px 8px
        rgba(0,0,0,.06);
    }


    #reader {

      width: 100%;

      max-width: 500px;

      margin: auto;
    }


    button {

      width: 100%;

      min-height: 48px;

      border: 0;

      border-radius: 10px;

      background: #1a73e8;

      color: white;

      font-size: 16px;

      font-weight: 600;

      margin-top: 10px;
    }


    button.secondary {

      background: #5f6368;
    }


    button.success {

      background: #188038;
    }


    button.danger {

      background: #d93025;
    }


    input,
    select,
    textarea {

      width: 100%;

      min-height: 44px;

      border:
        1px solid #dadce0;

      border-radius: 8px;

      padding: 9px 10px;

      font-size: 16px;

      background: white;
    }


    textarea {

      min-height: 90px;

      resize: vertical;
    }


    label {

      display: block;

      font-size: 14px;

      font-weight: 600;

      margin:
        12px 0 6px;
    }


    .book-title {

      font-size: 19px;

      font-weight: 700;

      line-height: 1.4;
    }


    .book-meta {

      color: #666;

      margin-top: 5px;

      line-height: 1.5;
    }


    .cover {

      width: 90px;

      max-height: 130px;

      object-fit: contain;

      float: right;

      margin-left: 12px;

      border-radius: 4px;
    }


    .clear {

      clear: both;
    }


    .status {

      padding: 10px;

      border-radius: 8px;

      background: #eef3f8;

      margin-bottom: 12px;

      font-size: 14px;
    }


    .status.error {

      background: #fce8e6;

      color: #c5221f;
    }


    .status.success {

      background: #e6f4ea;

      color: #137333;
    }


    .hidden {

      display: none !important;
    }


    .duplicate {

      background: #fff8e1;

      border-left:
        4px solid #f9ab00;

      padding: 10px;

      margin-top: 10px;

      border-radius: 5px;

      font-size: 14px;
    }


    .recent-item {

      padding: 10px 0;

      border-bottom:
        1px solid #eee;
    }


    .recent-item:last-child {

      border-bottom: 0;
    }


    .recent-title {

      font-weight: 600;
    }


    .small {

      color: #777;

      font-size: 13px;
    }


    .row {

      display: flex;

      gap: 8px;
    }


    .row > * {

      flex: 1;
    }

  </style>

</head>


<body>


<h1>📚 내 서재 스캐너</h1>


<div
  id="status"
  class="status">

  카메라를 시작하고
  책의 ISBN 바코드를
  비춰주세요.

</div>


<div class="card">

  <div id="reader"></div>


  <button
    id="startButton"
    onclick="startScanner()">

    📷 ISBN 스캔 시작

  </button>


  <button
    id="stopButton"
    class="secondary hidden"
    onclick="stopScanner()">

    카메라 끄기

  </button>

</div>


<div
  id="manualCard"
  class="card">

  <h2>직접 ISBN 입력</h2>


  <input
    id="manualISBN"
    type="text"
    inputmode="numeric"
    placeholder="ISBN-10 또는 ISBN-13">


  <button
    onclick="manualLookup()">

    ISBN 조회

  </button>

</div>


<div
  id="bookCard"
  class="card hidden">


  <div id="bookInfo"></div>


  <div id="duplicateInfo"></div>


  <h2>소장 정보</h2>


  <label>부록</label>

  <select id="supplement">

    <option value="확인 필요">
      확인 필요
    </option>

    <option value="있음">
      있음
    </option>

    <option value="없음">
      없음
    </option>

  </select>


  <label>책갈피</label>

  <select id="bookmarkCount">
    <option value="확인 필요">확인 필요</option>
    <option value="없음">없음</option>
    <option value="1개">1개</option>
    <option value="2개 이상">2개 이상</option>
  </select>

  <label>부록 상세</label>

  <input
    id="supplementDetail"
    placeholder="예: 엽서 3장, CD, 포스터">


  <label>띠지</label>

  <select id="obi">

    <option value="확인 필요">
      확인 필요
    </option>

    <option value="있음">
      있음
    </option>

    <option value="없음">
      없음
    </option>

  </select>


  <label>초판</label>

  <select id="firstEdition">

    <option value="확인 필요">
      확인 필요
    </option>

    <option value="예">
      예
    </option>

    <option value="아니오">
      아니오
    </option>

  </select>


  <label>책 상태</label>

  <select id="condition">
    <option value="확인 필요">확인 필요</option>
    <option value="미개봉">미개봉</option>
    <option value="개봉">개봉</option>
  </select>

  <label>표지 보유 여부</label>

  <select id="coverExists">
    <option value="확인 필요">확인 필요</option>
    <option value="있음">있음</option>
    <option value="없음">없음</option>
  </select>

  <label>열람 유무</label>
  <select id="readingStatus">
    <option value="확인 필요">확인 필요</option>
    <option value="있음">있음</option>
    <option value="없음">없음</option>
  </select>

  <label>한정&특별</label>
  <select id="limitedSpecial">
    <option value="확인 필요">확인 필요</option>
    <option value="예">예</option>
    <option value="아니오">아니오</option>
  </select>

  <label>제본크기</label>
  <select id="bindingSize">
    <option value="기타">기타</option>
    <option value="문고본">문고본</option>
    <option value="단행본">단행본</option>
    <option value="화집">화집</option>
  </select>


  <label>보관 위치</label>

  <input
    id="location"
    placeholder="예: 서재A-3단-12">


  <label>구매일</label>

  <input
    id="purchaseDate"
    type="date">


  <label>구매 가격</label>

  <input
    id="purchasePrice"
    type="number"
    inputmode="numeric"
    placeholder="원">


  <label>메모</label>

  <textarea
    id="note"
    placeholder="특이사항"></textarea>


  <button
    class="success"
    onclick="saveBook()">

    💾 서재에 저장

  </button>


  <button
    class="secondary"
    onclick="resetBook()">

    다음 책 스캔

  </button>


</div>


<div class="card">

  <h2>최근 등록</h2>

  <div id="recent">
    불러오는 중...
  </div>

</div>



<script>

// 배포한 Google Apps Script 웹 앱의 /exec 주소를 입력하세요.
// 예: https://script.google.com/macros/s/배포ID/exec
const GAS_API_URL = '__GAS_URL__';

/** GitHub Pages에서 GAS doPost API 호출 */
async function apiRequest(action, payload = {}) {
  if (!GAS_API_URL || GAS_API_URL === 'YOUR_GAS_WEB_APP_URL') {
    throw new Error('GAS_API_URL에 Google Apps Script 웹 앱 URL을 설정해주세요.');
  }

  let response;
  try {
    response = await fetch(GAS_API_URL, {
      method: 'POST',
      // text/plain 요청은 JSON Content-Type의 CORS preflight를 피하기 위한 설정입니다.
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...payload }),
      redirect: 'follow'
    });
  } catch (error) {
    throw new Error('GAS 서버에 연결하지 못했습니다. 배포 URL과 웹 앱 액세스 권한을 확인해주세요. (' + error.message + ')');
  }

  if (!response.ok) {
    throw new Error('서버 응답 오류: HTTP ' + response.status);
  }

  let result;
  try {
    result = await response.json();
  } catch (error) {
    throw new Error('서버 응답을 JSON으로 읽지 못했습니다. GAS 배포 및 접근 권한을 확인해주세요.');
  }

  if (!result.success) {
    throw new Error(result.error || '요청 처리 중 오류가 발생했습니다.');
  }
  return result.data;
}

let scanner = null;

let currentBook = null;

let scanning = false;

let lastScan = '';

let lastScanTime = 0;


/**
 * 상태 메시지
 */
function setStatus(
  message,
  type = ''
) {

  const el =
    document.getElementById(
      'status'
    );


  el.textContent = message;

  el.className = 'status';


  if (type) {

    el.classList.add(type);
  }
}


/**
 * 스캐너 시작
 */
function startScanner() {

  if (scanning) {
    return;
  }

  setStatus(
    '📷 카메라 권한을 요청하는 중입니다...'
  );

  // 먼저 브라우저의 카메라 권한을 직접 요청합니다.
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setStatus('이 브라우저에서는 카메라를 사용할 수 없습니다. HTTPS로 접속해주세요.', 'error');
    return;
  }

  navigator.mediaDevices
    .getUserMedia({
      video: {
        facingMode: {
          ideal: 'environment'
        }
      },
      audio: false
    })

    .then(function(stream) {

      // 권한 확인 후 즉시 스트림 종료
      stream.getTracks().forEach(
        function(track) {
          track.stop();
        }
      );

      setStatus(
        '📷 카메라 권한 확인 완료. 스캐너를 시작합니다...'
      );

      scanner =
        new Html5Qrcode('reader');

      const config = {

        fps: 10,

        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const width =
            Math.floor(
              viewfinderWidth * 0.85
            );

          const height =
            Math.floor(
              viewfinderHeight * 0.30
            );

          return {
            width: width,
            height: height
          };
        },

        formatsToSupport: [

          Html5QrcodeSupportedFormats.EAN_13,

          Html5QrcodeSupportedFormats.EAN_8

        ],

        rememberLastUsedCamera: true

      };


      scanner.start(

        {
          facingMode: 'environment'
        },

        config,

        onScanSuccess,

        onScanError

      )

      .then(function() {

        scanning = true;

        document
          .getElementById('startButton')
          .classList
          .add('hidden');

        document
          .getElementById('stopButton')
          .classList
          .remove('hidden');

        setStatus(
          '📷 카메라가 켜졌습니다. 책의 ISBN 바코드를 비춰주세요.',
          'success'
        );

      })

      .catch(function(error) {

        console.error(
          'Html5Qrcode start error:',
          error
        );

        setStatus(

          '카메라를 시작하지 못했습니다: ' +
          getCameraErrorMessage(error),

          'error'
        );

      });

    })

    .catch(function(error) {

      console.error(
        'getUserMedia error:',
        error
      );

      setStatus(

        '카메라 접근이 거부되었습니다: ' +
        getCameraErrorMessage(error),

        'error'
      );

    });
}


/**
 * 스캔 성공
 */
function onScanSuccess(
  decodedText
) {

  const now =
    Date.now();


  // 같은 바코드 반복 인식 방지
  if (

    decodedText === lastScan &&

    now - lastScanTime < 3000

  ) {

    return;
  }


  lastScan =
    decodedText;

  lastScanTime =
    now;


  let isbn =
    decodedText
      .replace(
        /[^0-9Xx]/g,
        ''
      )
      .toUpperCase();


  if (

    isbn.length !== 13 &&

    isbn.length !== 10

  ) {

    setStatus(

      'ISBN 형식으로 보이지 않습니다: ' +
      isbn,

      'error'
    );

    return;
  }


  stopScanner();


  lookup(isbn);
}


/**
 * 스캔 오류는 무시합니다.
 */
function onScanError(
  errorMessage
) {

  // 카메라가 계속 프레임을
  // 읽기 때문에 오류 메시지는 표시하지 않습니다.
}


/**
 * 스캐너 중지
 */
function stopScanner() {

  if (
    !scanner ||
    !scanning
  ) {

    return;
  }


  scanner
    .stop()

    .then(() => {

      scanning = false;


      document
        .getElementById(
          'startButton'
        )
        .classList
        .remove('hidden');


      document
        .getElementById(
          'stopButton'
        )
        .classList
        .add('hidden');

    })

    .catch(err => {

      console.error(err);

    });
}


/**
 * 직접 ISBN 조회
 */
function manualLookup() {

  const isbn =
    document
      .getElementById(
        'manualISBN'
      )
      .value
      .trim();


  if (!isbn) {

    setStatus(
      'ISBN을 입력해주세요.',
      'error'
    );

    return;
  }


  lookup(isbn);
}


/**
 * ISBN 조회
 */
function lookup(isbn) {
  setStatus('📚 도서정보를 조회하는 중입니다...');
  apiRequest('lookup', { isbn })
    .then(function(book) {
      if (!book.found) {
        setStatus('도서정보를 찾지 못했습니다. ISBN을 확인해주세요.', 'error');
        return;
      }
      currentBook = book;
      showBook(book);
      checkDuplicate(book.isbn);
      setStatus('도서정보를 찾았습니다. 소장 정보를 입력해주세요.', 'success');
    })
    .catch(function(error) {
      console.error(error);
      setStatus('조회 오류: ' + error.message, 'error');
    });
}


/**
 * 책 정보 표시
 */
function showBook(book) {
  const cover = book.thumbnail
    ? `<img class="cover" src="${escapeHtml(book.thumbnail)}" alt="도서 표지">`
    : '';

  // API에서 가져온 기본 도서정보를 저장 전에 직접 수정할 수 있도록 입력란으로 표시합니다.
  document.getElementById('bookInfo').innerHTML = `
    ${cover}
    <h2 style="margin-top:0">도서정보 확인 및 편집</h2>
    <div class="book-meta">도서정보 조회 결과입니다. 필요한 항목을 수정한 뒤 저장하세요.</div>
    <div class="clear"></div>

    <label for="editTitle">제목</label>
    <input id="editTitle" value="${escapeHtml(book.title || '')}" placeholder="도서 제목">

    <label for="editSubtitle">부제목</label>
    <input id="editSubtitle" value="${escapeHtml(book.subtitle || '')}" placeholder="부제목">

    <label for="editAuthors">저자</label>
    <input id="editAuthors" value="${escapeHtml(book.authors || '')}" placeholder="저자">

    <label for="editPublisher">출판사</label>
    <input id="editPublisher" value="${escapeHtml(book.publisher || '')}" placeholder="출판사">

    <div class="row">
      <div>
        <label for="editPublishedDate">출간일</label>
        <input id="editPublishedDate" value="${escapeHtml(book.publishedDate || '')}" placeholder="예: 2025-01-01">
      </div>
      <div>
        <label for="editSeries">총서명</label>
        <input id="editSeries" value="${escapeHtml(book.series || '')}" placeholder="총서명">
      </div>
    </div>

    <label for="editVolume">권차</label>
    <input id="editVolume" value="${escapeHtml(book.volume || '')}" placeholder="예: 1, 제2권">

    <label for="editCategories">분류</label>
    <input id="editCategories" value="${escapeHtml(book.categories || '')}" placeholder="예: 소설, 에세이">

    <label>ISBN</label>
    <div class="book-meta">${escapeHtml(book.isbn || '')}</div>
  `;

  document.getElementById('duplicateInfo').innerHTML = '';
  document.getElementById('bookCard').classList.remove('hidden');
}

/**
 * 중복 확인
 */
function checkDuplicate(isbn) {
  apiRequest('duplicate', { isbn })
    .then(function(items) {
      const el = document.getElementById('duplicateInfo');
      if (!items || items.length === 0) {
        el.innerHTML = '';
        return;
      }

      let html = '<div class="duplicate">⚠️ 이 ISBN의 책을 이미 ' + items.length + '권 가지고 있습니다.';
      items.forEach(function(item) {
        html += '<br>· ' + escapeHtml(item.id);
        if (item.location) html += ' / ' + escapeHtml(item.location);
        if (item.condition) html += ' / ' + escapeHtml(item.condition);
      });
      html += '<br><br>같은 책을 추가로 소장하는 경우에는 그대로 저장하면 됩니다.</div>';
      el.innerHTML = html;
    })
    .catch(function(error) {
      console.error(error);
      document.getElementById('duplicateInfo').textContent = '중복 확인 실패: ' + error.message;
    });
}


/**
 * 책 저장
 */
function saveBook() {
  if (!currentBook) {
    setStatus('먼저 책을 조회해주세요.', 'error');
    return;
  }

  const book = {
    isbn: currentBook.isbn,
    title: document.getElementById('editTitle').value.trim(),
    subtitle: document.getElementById('editSubtitle').value.trim(),
    authors: document.getElementById('editAuthors').value.trim(),
    publisher: document.getElementById('editPublisher').value.trim(),
    publishedDate: document.getElementById('editPublishedDate').value.trim(),
    series: document.getElementById('editSeries').value.trim(),
    volume: document.getElementById('editVolume').value.trim(),
    categories: document.getElementById('editCategories').value.trim(),
    thumbnail: currentBook.thumbnail,
    source: currentBook.source,
    supplement: document.getElementById('supplement').value,
    bookmarkCount: document.getElementById('bookmarkCount').value,
    supplementDetail: document.getElementById('supplementDetail').value,
    obi: document.getElementById('obi').value,
    firstEdition: document.getElementById('firstEdition').value,
    condition: document.getElementById('condition').value,
    coverExists: document.getElementById('coverExists').value,
    readingStatus: document.getElementById('readingStatus').value,
    limitedSpecial: document.getElementById('limitedSpecial').value,
    bindingSize: document.getElementById('bindingSize').value,
    location: document.getElementById('location').value,
    purchaseDate: document.getElementById('purchaseDate').value,
    purchasePrice: document.getElementById('purchasePrice').value,
    note: document.getElementById('note').value
  };

  setStatus('저장하는 중입니다...');
  apiRequest('save', { book })
    .then(function(result) {
      setStatus('✅ 저장 완료: ' + result.collectionId, 'success');
      resetBook();
      loadRecent();
    })
    .catch(function(error) {
      console.error(error);
      setStatus('저장 오류: ' + error.message, 'error');
    });
}


/**
 * 다음 책 준비
 */
function resetBook() {

  currentBook =
    null;


  document
    .getElementById(
      'bookCard'
    )
    .classList
    .add('hidden');


  document
    .getElementById(
      'manualISBN'
    )
    .value = '';


  document
    .getElementById(
      'supplement'
    )
    .value =
      '확인 필요';


  document
    .getElementById(
      'bookmarkCount'
    )
    .value = '확인 필요';


  document
    .getElementById(
      'coverExists'
    )
    .value = '확인 필요';

  document.getElementById('readingStatus').value = '확인 필요';
  document.getElementById('limitedSpecial').value = '확인 필요';
  document.getElementById('bindingSize').value = '기타';


  document
    .getElementById(
      'supplementDetail'
    )
    .value = '';


  document
    .getElementById(
      'obi'
    )
    .value =
      '확인 필요';


  document
    .getElementById(
      'firstEdition'

    .getElementById(

    )
    .value = '';

    .getElementById(

    )
    .value = '';

    .getElementById(
      'purchasePrice'

}


/**
 * 최근 등록 목록
 */
function loadRecent() {
  const el = document.getElementById('recent');
  el.textContent = '불러오는 중...';

  apiRequest('recent')
    .then(function(items) {
      if (!items || items.length === 0) {
        el.innerHTML = '<div class="small">아직 등록된 책이 없습니다.</div>';
        return;
      }
      el.innerHTML = items.map(function(item) {
        return '<div class="recent-item">' +
          '<div class="recent-title">' + escapeHtml((item.title || '(제목 없음)') + (item.volume ? ' ' + item.volume : '')) + '</div>' +
          '<div class="small">' + escapeHtml(item.author || '') + '</div>' +
          '<div class="small">' + escapeHtml(item.id || '') + ' · ' +
          escapeHtml(item.supplement || '') + ' · ' + escapeHtml(item.condition || '') +
          (item.location ? ' · ' + escapeHtml(item.location) : '') + '</div>' +
          '</div>';
      }).join('');
    })
    .catch(function(error) {
      console.error(error);
      el.textContent = '최근 목록을 불러오지 못했습니다: ' + error.message;
    });
}


/**
 * HTML escape
 */
function escapeHtml(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return '';
  }


  return String(value)

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );
}


/**
 * 페이지 로딩
 */
window.addEventListener(
  'load',
  function() {

    loadRecent();

  }
);
function getCameraErrorMessage(error) {

  if (!error) {
    return '알 수 없는 오류입니다.';
  }

  const name =
    error.name || '';

  const message =
    error.message || '';


  switch (name) {

    case 'NotAllowedError':

      return (
        '카메라 사용이 차단되었습니다. ' +
        'Chrome의 사이트 권한에서 카메라를 허용해주세요.'
      );


    case 'PermissionDeniedError':

      return (
        '카메라 권한이 거부되었습니다. ' +
        'Chrome의 사이트 설정에서 카메라 권한을 허용해주세요.'
      );


    case 'NotFoundError':

      return (
        '사용 가능한 카메라를 찾지 못했습니다.'
      );


    case 'NotReadableError':

      return (
        '카메라가 다른 앱에서 사용 중이거나 ' +
        '카메라에 접근할 수 없습니다.'
      );


    case 'OverconstrainedError':

      return (
        '후면 카메라를 사용할 수 없습니다. ' +
        '다른 카메라 설정을 시도해주세요.'
      );


    case 'SecurityError':

      return (
        '보안 정책 때문에 카메라 사용이 차단되었습니다. ' +
        'HTTPS로 접속했는지 확인해주세요.'
      );


    default:

      return (
        name +
        (message ? ' — ' + message : '')
      );
  }
}
